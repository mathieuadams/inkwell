AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lets GitHub Actions in one repository deploy Inkwell with short-lived credentials (OIDC).
  The role can only assume the CDK bootstrap roles, so what it can change is limited to CDK deployments.

Parameters:
  GitHubOwner:
    Type: String
  GitHubRepo:
    Type: String
    Default: inkwell
  GitHubOwnerId:
    Type: String
  GitHubRepoId:
    Type: String
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub inkwell-github-deploy-${GitHubRepo}
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:*
                  - !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:*
      Policies:
        - PolicyName: assume-cdk-bootstrap-roles
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-*
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
